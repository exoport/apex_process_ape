name: CI

on:
  push:
    # ci/** runs the matrix on a candidate without a throwaway trigger commit:
    # the branch tip is the candidate, .github included.
    branches: [main, 'ci/**']
  pull_request:
  # Daily on the default branch: catches runner-image drift and advisories
  # published overnight, which no push would. GitHub reads `schedule` and
  # `workflow_dispatch` only from the default branch, and disables a schedule
  # after 60 days without repository activity.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs everything.
          - os: ubuntu-latest
            test_target: test
          # Windows BUILDS everything (that is the portability check) but runs only the
          # portable packages: the Linux host stack — aped and netd — tests POSIX mode
          # bits, /run/netns paths and systemd units, none of which Windows has. See the
          # NON_PORTABLE_PKG_RE comment in the Makefile.
          - os: windows-latest
            test_target: test-portable
    defaults:
      run:
        # bash is available on all three runners (MSYS2-provided on
        # Windows). Pin it so `./ape version` and Makefile invocations
        # work uniformly across the matrix.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Test
        # tee keeps the log for the annotation step below; pipefail keeps
        # make's exit status as the step's.
        run: |
          set -o pipefail
          make ${{ matrix.test_target }} 2>&1 | tee test.log

      - name: Annotate test failures
        # Run logs are 403 without auth, so a red run would name no test.
        # Annotations are public: lift each failure line into one. Runs only
        # after a failure, so it cannot turn a green run red.
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          grep -E -e '--- FAIL' -e '^panic:' -e '^FAIL' test.log | head -n 40 \
            | sed -e 's/%/%25/g' -e 's/^/::error title=go test::/' || true

      - name: Smoke — ./ape version
        # Catches //go:build constraint regressions that would let a
        # package compile but produce a binary that errors on first
        # invocation under the matrix OS. The MSYS2 bash on
        # windows-latest resolves `./ape` to the literal output of
        # `go build -o ape`, no .exe suffix.
        run: ./ape version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        run: make lint

      # docs/reference/cli.md is generated from the cobra command tree, so a
      # help-text edit in internal/apecmd/ desyncs it silently. Hermetic —
      # just regenerates and diffs — so unlike the check-* harness gates it
      # can run here rather than only on a developer machine.
      - name: Check generated CLI reference is in sync
        run: make docs-cli-check

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: make govulncheck
